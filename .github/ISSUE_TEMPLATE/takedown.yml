name: Takedown request
description: Ask for a logo to be removed.
title: "Takedown: <domain>"
labels: ["takedown"]
body:
  - type: input
    id: domain
    attributes:
      label: Domain
      description: The domain whose logo you want removed.
      placeholder: example.com
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof you own the mark
      description: A trademark registration, or a way we can check you work for the company.
    validations:
      required: true
  - type: textarea
    id: remove
    attributes:
      label: What to remove
      description: The wordmark, the icon, or both.
    validations:
      required: true
