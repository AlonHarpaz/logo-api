name: publish

# Stages a new logoapi version on npm when a v*.*.* tag is pushed.
# Trusted publishing (OIDC) only: no tokens, no secrets. The trusted publisher
# on npm allows staging only, so a maintainer approves each version in npm.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm stage needs npm 11.15.0 or newer (trusted publishing needs 11.5.1).
      - name: Install npm
        run: npm install -g npm@11.21.1

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          version=$(node -p "require('./packages/logoapi/package.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag commit is not on main"; exit 1; }

      - name: Test
        working-directory: packages/logoapi
        run: |
          npm run prepack
          npm test

      - name: Stage publish
        working-directory: packages/logoapi
        run: npm stage publish --provenance --access public
